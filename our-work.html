<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Work - NFD</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared/site-ui.css" />
    <style>
      :root {
        --highlight-color: #50c7d2;
      }
      /* Language Toggle (match other pages) */
      .lang-toggle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-left: 1rem;
      }
      .lang-toggle .lang-btn {
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #fff;
        background: transparent;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
      }
      .lang-toggle .lang-btn[aria-pressed="true"] {
        background: var(--highlight-color);
        color: #0b1020;
        border-color: transparent;
      }

      html,
      body {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
      }

      .navbar {
        background-color: #000;
        padding: 1rem 2rem;
      }

      .navbar-brand {
        font-size: 1.4rem;
        font-weight: 600;
        color: #fff !important;
      }

      .navbar-nav {
        gap: 2.5rem;
      }

      .navbar-nav .nav-link {
        color: white !important;
        font-size: 1.4rem;
        padding: 0.5rem 1rem;
        position: relative;
      }

      .navbar-nav .nav-link.active::before {
        content: "";
        display: block;
        height: 4px;
        background-color: var(--highlight-color);
        width: 100%;
        position: absolute;
        bottom: -8px;
        left: 0;
        border-radius: 2px;
      }

      .navbar-nav .dropdown-toggle::after {
        margin-left: 0.45rem;
        vertical-align: 0.18em;
      }

      .navbar-nav .dropdown-toggle.active::before {
        display: none;
      }

      .navbar-nav .dropdown-menu {
        background-color: #111;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 0.5rem;
        min-width: 12rem;
      }

      .navbar-nav .dropdown-item {
        color: #fff;
        font-size: 1rem;
        border-radius: 8px;
        padding: 0.65rem 0.85rem;
      }

      .navbar-nav .dropdown-item:hover,
      .navbar-nav .dropdown-item:focus {
        background-color: var(--highlight-color);
        color: #0b1020;
      }

      .navbar-nav .dropdown-item.active {
        background-color: rgba(80, 199, 210, 0.18);
        color: #dffbff;
      }

      .navbar-nav .dropdown-menu:hover .dropdown-item.active:not(:hover) {
        background-color: transparent;
        color: #fff;
      }


      .section-header {
        text-align: center;
        padding: 0.5rem 1rem 1rem;
      }

      .project-wrapper {
        max-width: 900px;
        margin: 3rem auto;
        position: relative;
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .project-wrapper.project1 {
        flex-direction: row;
        align-items: flex-start;
        position: relative;
        overflow: visible;
      }

      .project-wrapper.project2 {
        flex-direction: row;
        align-items: flex-start;
        position: relative;
        overflow: visible;
      }

      .project-block {
        position: relative;
        text-align: left;
        z-index: 1;
      }

      .project-block.below-caption {
        z-index: 2;
        position: relative;
      }

      .project-wrapper.project2 .below-caption {
        margin-left: 1rem;
        text-align: right;
        padding-right: 0.3rem;
      }

      .project-block img {
        width: 100%;
        height: auto;
        display: block;
        margin-left: auto;
        margin-right: auto;
        max-width: 620px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .project-block img:hover {
        transform: scale(1.03);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        cursor: pointer;
      }

      .section-title {
        text-align: center;
        margin-top: 3rem;
        margin-bottom: 1rem;
        font-size: 2.2rem;
        font-weight: 600;
      }

      .section-subtitle {
        text-align: center;
        margin-bottom: 1rem;
        font-size: 1.4rem;
        color: #555;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }

      .line-first {
        position: absolute;
        top: 3.5rem;
        left: -60px;
        width: 100vw;
        height: 4px;
        background-color: var(--highlight-color);
        z-index: 0;
      }

      .line-second {
        position: absolute;
        top: 3.5rem;
        right: -60px;
        width: 100vw;
        height: 4px;
        background-color: var(--highlight-color);
        z-index: 0;
      }

      .project2 .line {
        left: auto;
        right: 0;
      }

      .caption {
        font-size: 1.1rem;
        color: white;
        font-weight: 400;
        text-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
        max-width: 300px;
      }

      .below-caption {
        font-size: 1.1rem;
        color: black;
        text-align: left;
        max-width: 300px;
      }

      @media (max-width: 768px) {
        html {
          font-size: 80%;
        }
        .navbar-nav .nav-link {
          font-size: 1.1rem;
        }

        .section-subtitle {
          /* font-size: 1.15rem; */
          line-height: 1.5;
        }

        .project-wrapper {
          flex-direction: column !important;
          align-items: center;
        }

        .project-block img {
          max-width: calc(100% - 2rem);
          margin: 0 1rem;
        }

        .caption,
        .below-caption {
          max-width: 100%;
          text-align: center;
          margin-left: 0 !important;
        }

        .line-first {
          display: none;
        }

        .line-second {
          display: none;
        }

        .project-block.below-caption {
          text-align: left;
          padding: 0 1rem;
        }
        .second-work {
          text-align: left;
        }
        .navbar-nav .nav-item:last-child {
          margin-bottom: 0.75rem; /* space below 'Contact' */
        }
        .navbar .lang-toggle {
          margin-top: 0.75rem; /* push language toggle down */
          padding-top: 0.5rem;
          border-top: 1px solid rgba(255, 255, 255, 0.25); /* subtle divider */
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <div id="site-nav"></div>

    <main
      class="container d-flex flex-column flex-grow-1 mt-5"
      style="margin-top: auto; margin-bottom: auto"
    >
      <!-- Section Header -->
      <div class="section-header">
        <h2 class="section-title" data-i18n="work.heading">Our Work</h2>
        <p class="section-subtitle" data-i18n="work.subtitle">
          Delivering high-performance data center solutions — our portfolio
          reflects precision, reliability, and innovation.
        </p>
      </div>

      <!-- Project 1 -->
      <div class="project-wrapper project1" style="position: relative">
        <div class="project-block order-1 order-md-1">
          <a href="first-work.html"
            ><img src="images/07 Our Work 01.webp" alt="Project 1"
          /></a>
        </div>
        <div class="project-block below-caption order-2 order-md-2">
          <span data-i18n="work.p1.caption"
            >Confidential Data Center Colocation Company</span
          >
          <div class="line-first"></div>
          <div
            style="
              font-weight: 600;
              font-size: 1.5rem;
              margin-top: 0.75rem;
              margin-bottom: 0.75rem;
              color: var(--highlight-color);
            "
            data-i18n="work.p1.location"
          >
            Yongin, South Korea
          </div>
        </div>
      </div>

      <!-- Project 2 -->
      <div class="project-wrapper project2" style="position: relative">
        <div class="project-block below-caption order-4 order-md-3">
          <span data-i18n="work.p2.caption"
            >Confidential Data Center Colocation Company</span
          >
          <div class="line-second"></div>
          <div
            class="second-work"
            style="
              font-weight: 600;
              font-size: 1.5rem;
              margin-top: 0.75rem;
              margin-bottom: 0.75rem;
              color: var(--highlight-color);
            "
            data-i18n="work.p2.location"
          >
            Ansan, South Korea
          </div>
        </div>
        <div class="project-block order-3 order-md-4">
          <a href="second-work.html"
            ><img src="images/07 Our Work 02.webp" alt="Project 2"
          /></a>
        </div>
      </div>
    </main>
    <script src="shared/site-ui.js"></script>
    <script src="shared/site-i18n.js"></script>
    <script src="data/i18n/our-work.js"></script>
    <script>
      const I18N = window.NFD_PAGE_I18N;
      window.NFDSiteI18n.init({
        dict: I18N,
        titleKey: "page.title"
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
