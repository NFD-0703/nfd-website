<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | NFD</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared/site-ui.css" />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        margin: 0;
        color: #333;
        background-color: #fff;
      }

      :root {
        --highlight-color: #50c7d2;
      }

      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
      }

      .navbar {
        background-color: #000;
        padding: 1rem 2rem;
      }

      .navbar-brand {
        font-size: 1.4rem;
        font-weight: 600;
        color: #fff !important;
      }

      .navbar-nav {
        gap: 2.5rem;
      }

      .navbar-nav .nav-link {
        color: white !important;
        font-size: 1.4rem;
        padding: 0.5rem 1rem;
        position: relative;
      }

      .navbar-nav .nav-link.active::before {
        content: "";
        display: block;
        height: 4px;
        background-color: var(--highlight-color);
        width: 100%;
        position: absolute;
        bottom: -8px;
        left: 0;
        border-radius: 2px;
      }

      .navbar-nav .dropdown-toggle::after {
        margin-left: 0.45rem;
        vertical-align: 0.18em;
      }

      .navbar-nav .dropdown-toggle.active::before {
        display: none;
      }

      .navbar-nav .dropdown-menu {
        background-color: #111;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 0.5rem;
        min-width: 12rem;
      }

      .navbar-nav .dropdown-item {
        color: #fff;
        font-size: 1rem;
        border-radius: 8px;
        padding: 0.65rem 0.85rem;
      }

      .navbar-nav .dropdown-item:hover,
      .navbar-nav .dropdown-item:focus {
        background-color: var(--highlight-color);
        color: #0b1020;
      }

      .navbar-nav .dropdown-item.active {
        background-color: rgba(80, 199, 210, 0.18);
        color: #dffbff;
      }

      .navbar-nav .dropdown-menu:hover .dropdown-item.active:not(:hover) {
        background-color: transparent;
        color: #fff;
      }


      .map-container {
        width: 100%;
        height: 400px;
        overflow: hidden;
      }

      .map-container iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      /* Lightweight map placeholder */
      .map-placeholder {
        width: 100%;
        height: 100%;
        position: relative;
        background: #e9eef3;
        background-image: linear-gradient(135deg, #edf2f7 25%, transparent 25%),
          linear-gradient(225deg, #edf2f7 25%, transparent 25%),
          linear-gradient(45deg, #edf2f7 25%, transparent 25%),
          linear-gradient(315deg, #edf2f7 25%, #e9eef3 25%);
        background-position: 16px 0, 16px 0, 0 0, 0 0;
        background-size: 32px 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        overflow: hidden;
      }
      .map-placeholder .hint {
        position: absolute;
        z-index: 1;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        padding: 0.4rem 0.7rem;
        border-radius: 999px;
        font-size: 0.9rem;
        line-height: 1;
      }
      .map-placeholder .pin {
        width: 64px;
        height: 64px;
        opacity: 0.25;
      }

      .contact-section {
        text-align: center;
        padding: 3rem 5%;
      }

      .contact-section h2 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }

      .contact-section p {
        max-width: 700px;
        margin: 0 auto 2rem;
        font-size: 1rem;
        color: #555;
      }

      .contact-container {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        max-width: 900px;
        margin: 0 auto;
      }

      .contact-info {
        display: flex;
        justify-content: center;
        gap: 1.25rem;
        flex-wrap: nowrap;
        margin-bottom: 0.8rem;
        width: 100%;
      }

      .info-box {
        border: 1px solid #ccc;
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        min-width: 220px;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background-color: #f9f9f9;
        flex: 1;
      }

      .info-box h5 {
        color: #50c7d2;
        margin-bottom: 0.25rem;
        font-size: 0.95rem;
      }

      .info-box p {
        font-size: 0.9rem;
        margin: 0;
      }

      .contact-icon {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
      }

      .form-control {
        border-radius: 4px;
        padding: 0.75rem 1rem;
      }

      .contact-form {
        width: 100%;
        margin-top: 1.5rem;
        display: flex;
        flex-direction: column;
      }

      .contact-container {
        width: 100%;
      }
      .contact-form {
        max-width: 100%;
      }

      .contact-info,
      .contact-form {
        max-width: 100%;
      }

      .contact-form .row > * {
        padding-right: 0.5rem;
        padding-left: 0.5rem;
        margin-bottom: 1rem;
      }

      .btn-submit {
        background-color: #50c7d2;
        color: white;
        padding: 0.75rem 2rem;
        border: none;
        border-radius: 4px;
      }

      .btn-submit:hover {
        background-color: #3cb1bd;
      }

      .contact-form input[name="subject"] {
        margin-bottom: 1rem;
      }

      @media (max-width: 768px) {
        html {
          font-size: 80%;
        }

        .map-container {
          height: 300px;
        }

        .contact-info {
          flex-direction: column;
          align-items: stretch;
        }
        .contact-info .info-box {
          flex-direction: row;
          gap: 1rem;
          border: none;
          border-top: 1px solid #ddd;
          border-bottom: 1px solid #ddd;
          border-radius: 0;
          padding: 1rem;
          background-color: #fdfdfd;
          width: 100%;
          max-width: 100%;
          box-sizing: border-box;
        }
        .contact-info .info-box + .info-box {
          border-top: none;
        }
        .contact-section p {
          text-align: left;
        }
      }
      /* Language Toggle (unified) */
      .lang-toggle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-left: 1rem;
      }
      .lang-toggle .lang-btn {
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #fff;
        background: transparent;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
      }
      .lang-toggle .lang-btn[aria-pressed="true"] {
        background: var(--highlight-color);
        color: #0b1020;
        border-color: transparent;
      }
      /* Increase spacing between 'Contact' and language toggle on collapsed navbar */
      @media (max-width: 991.98px) {
        .navbar-nav .nav-item:last-child {
          margin-bottom: 0.75rem; /* space below 'Contact' */
        }
        .navbar .lang-toggle {
          margin-top: 0.75rem; /* push language toggle down */
          padding-top: 0.5rem;
          border-top: 1px solid rgba(255, 255, 255, 0.25); /* subtle divider */
        }
      }
    </style>
    <link rel="preconnect" href="https://www.google.com" crossorigin />
    <link rel="preconnect" href="https://maps.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <link rel="dns-prefetch" href="https://maps.gstatic.com" />
  </head>
  <body>
    <!-- Navbar -->
    <div id="site-nav"></div>

    <!-- 지도 -->
    <div
      class="map-container"
      id="mapContainer"
      data-src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3165.0979382507235!2d127.02179107651612!3d37.50560817205444!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x357ca3797068b6ad%3A0x7331e860ec159340!2z7Yyo7Iqk7Yq47YyM7J2067iMIOyLoOuFvO2YhDLtmLjsoJA!5e0!3m2!1sko!2skr!4v1751885399326!5m2!1sko!2skr"
    >
      <div
        class="map-placeholder"
        id="mapPlaceholder"
        role="button"
        aria-label="Load map"
      >
        <svg class="pin" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2C8.14 2 5 5.14 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.86-3.14-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"
            fill="currentColor"
          />
        </svg>
        <span class="hint" data-i18n="map.hint">Click to load map</span>
      </div>
      <noscript>
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3165.0979382507235!2d127.02179107651612!3d37.50560817205444!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x357ca3797068b6ad%3A0x7331e860ec159340!2z7Yyo7Iqk7Yq47YyM7J2067iMIOyLoOuFvO2YhDLtmLjsoJA!5e0!3m2!1sko!2skr!4v1751885399326!5m2!1sko!2skr"
          width="600"
          height="450"
          style="border: 0"
          allowfullscreen
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </noscript>
    </div>

    <!-- 문의 섹션 -->
    <section class="contact-section">
      <h2 data-i18n="contact.heading">Contact</h2>
      <p data-i18n="contact.subtitle">
        Have a project in mind or facing a critical challenge? Let’s connect —
        we bring purpose-driven solutions, guided by expertise and integrity.
      </p>

      <div class="contact-container">
        <div class="contact-info">
          <div class="info-box">
            <img src="images/pin.png" alt="Address Icon" class="contact-icon" />
            <div class="text-start">
              <h5 data-i18n="contact.addr.title">Address</h5>
              <p data-i18n="contact.addr.text">
                199-2 Nonhyun-dong, Gangnam-gu, Seoul
              </p>
            </div>
          </div>
          <div class="info-box">
            <img src="images/mail.png" alt="Email Icon" class="contact-icon" />
            <div class="text-start">
              <h5 data-i18n="contact.email.title">Email Us</h5>
              <p data-i18n="contact.email.text">enquiry@nfd.kr</p>
            </div>
          </div>
          <div class="info-box">
            <img
              src="images/linkedin.svg"
              alt="LinkedIn Icon"
              class="contact-icon"
            />
            <div class="text-start">
              <h5 data-i18n="contact.linkedin.title">LinkedIn</h5>
              <p>
                <a
                  href="https://www.linkedin.com/company/nfd-home"
                  target="_blank"
                  style="color: inherit; text-decoration: none"
                  data-i18n="contact.linkedin.cta"
                  >Connect with us</a
                >
              </p>
            </div>
          </div>
        </div>

        <form id="contact-form" class="contact-form">
          <div class="row gx-3">
            <div class="col-md-6">
              <input
                type="text"
                name="name"
                class="form-control"
                placeholder="Your Name"
                required
                data-i18n-attr='{"placeholder":"form.name"}'
              />
            </div>
            <div class="col-md-6">
              <input
                id="emailInput"
                type="email"
                name="email"
                class="form-control"
                placeholder="Your Email"
                required
                autocomplete="email"
                inputmode="email"
                data-i18n-attr='{"placeholder":"form.email"}'
              />
            </div>
          </div>
          <input
            type="text"
            name="subject"
            class="form-control"
            placeholder="Subject"
            data-i18n-attr='{"placeholder":"form.subject"}'
          />
          <textarea
            name="message"
            rows="5"
            class="form-control"
            placeholder="Message"
            required
            data-i18n-attr='{"placeholder":"form.message"}'
          ></textarea>
          <!-- Formspree 스팸 방지용 필드 (bot이 자동 작성하는 필드를 숨김 처리) -->
          <input type="text" name="_gotcha" style="display: none" />

          <button type="submit" class="btn-submit mt-3" data-i18n="form.submit">
            Send Message
          </button>
        </form>
      </div>
    </section>

    <script>
      (function () {
        const container = document.getElementById("mapContainer");
        const placeholder = document.getElementById("mapPlaceholder");
        if (!container || !placeholder) return;
        const src = container.getAttribute("data-src");
        let loaded = false;
        function loadIframe() {
          if (loaded) return;
          loaded = true;
          const ifr = document.createElement("iframe");
          ifr.src = src;
          ifr.width = "600";
          ifr.height = "450";
          ifr.style.border = "0";
          ifr.allowFullscreen = true;
          ifr.loading = "lazy";
          ifr.referrerPolicy = "no-referrer-when-downgrade";
          container.replaceChild(ifr, placeholder);
        }
        placeholder.addEventListener("click", loadIframe);
        if ("IntersectionObserver" in window) {
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((e) => {
                if (e.isIntersecting) {
                  loadIframe();
                  io.disconnect();
                }
              });
            },
            { root: null, rootMargin: "200px", threshold: 0.01 }
          );
          io.observe(placeholder);
        }
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="shared/site-ui.js"></script>
    <script src="shared/site-i18n.js"></script>
    <script src="data/i18n/contact.js"></script>
    <script>
      const I18N = window.NFD_PAGE_I18N;

      let CURRENT_LANG = null;
      window.NFDSiteI18n.init({
        dict: I18N,
        titleKey: "page.title",
        onAfterSetLang(lang) {
          CURRENT_LANG = lang;
          const email = document.getElementById("emailInput");
          if (email) email.setCustomValidity("");
        },
      });

      // ---- Field validation (email) ----
      (function attachEmailValidation() {
        const email = document.getElementById("emailInput");
        if (!email) return;
        function message() {
          const dict =
            I18N[CURRENT_LANG || window.NFDSite.detectInitialLang()] || I18N.en;
          return (
            dict["form.email.invalid"] || "Please enter a valid email address."
          );
        }
        // Clear custom message on input and re-validate
        email.addEventListener("input", () => {
          email.setCustomValidity("");
          // if field has value but browser says invalid, set message so UI can show it on submit
          if (email.validity.typeMismatch || email.validity.patternMismatch) {
            email.setCustomValidity(message());
          }
        });
        // When invalid event fires, set our localized message
        email.addEventListener("invalid", () => {
          if (email.validity.typeMismatch || email.validity.patternMismatch) {
            email.setCustomValidity(message());
          }
        });
      })();

      // ---- Form submit (localized alerts) ----
      const form = document.getElementById("contact-form");
      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        const formData = new FormData(form);
        try {
          const response = await fetch("https://formspree.io/f/xzzaqrpz", {
            method: "POST",
            headers: { Accept: "application/json" },
            body: formData,
          });
          const dict =
            I18N[CURRENT_LANG || window.NFDSite.detectInitialLang()] || I18N.en;
          if (response.ok) {
            alert(dict["form.alert.success"]);
            form.reset();
          } else {
            alert(dict["form.alert.error"]);
          }
        } catch (error) {
          const dict =
            I18N[CURRENT_LANG || window.NFDSite.detectInitialLang()] || I18N.en;
          alert(dict["form.alert.exception"] + error.message);
        }
      });
    </script>
  </body>
</html>
